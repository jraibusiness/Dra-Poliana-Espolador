<!DOCTYPE html>
<html lang="pt-BR">
<head><?!= include('Estilo'); ?>
<style>
.topo{position:sticky;top:0;z-index:50;background:var(--noir);border-bottom:1px solid var(--borda);
  display:flex;align-items:center;gap:10px;padding:12px 16px}
.topo h1{font-size:17px;color:var(--gold);flex:1}
.topo .util{color:var(--texto-2)}
#btnTour{background:var(--gold-suave);color:var(--gold);border:1px solid var(--gold);
  border-radius:50%;width:34px;height:34px;font-family:var(--font-util);font-size:15px}
nav.abas{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--noir);
  border-bottom:1px solid var(--borda);position:sticky;top:57px;z-index:49}
nav.abas button{white-space:nowrap;padding:9px 16px;background:transparent;color:var(--texto-2);
  border:1px solid var(--borda);border-radius:99px;font-size:15px}
nav.abas button.sel{background:var(--gold);color:var(--noir);border-color:var(--gold)}
main{max-width:900px;margin:0 auto;padding:16px 14px 60px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filtros select{width:auto;flex:1;min-width:130px;font-size:15px;padding:9px 10px}
.item{margin-bottom:12px}
.item .linha1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .nome{font-size:18px;font-weight:500;flex:1}
.item .meta{color:var(--texto-2);font-size:14.5px;margin-top:4px}
.item .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.item .acoes button,.item .acoes a{font-size:14px;padding:9px 13px}
.score{font-family:var(--font-util);font-size:13px;color:var(--gold)}
.vazio{color:var(--texto-2);text-align:center;padding:30px 0}
.alertaHoje{border-left:3px solid var(--erro);padding-left:14px}
.relato{background:var(--noir);border-radius:var(--raio);padding:12px;margin-top:10px;
  font-style:italic;color:var(--texto-2);font-size:15.5px}
/* modal genérico */
.veu{position:fixed;inset:0;background:rgba(5,8,14,.82);z-index:90;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--borda);border-radius:14px;max-width:560px;width:100%;
  max-height:86vh;overflow-y:auto;padding:22px}
.modal h3{color:var(--gold);margin-bottom:14px}
.modal textarea{min-height:150px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--borda)}
.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--gold)}
.chk label{flex:1;font-size:16px}
.chk .dica{color:var(--texto-2);font-size:13.5px}
/* tour */
#tourVeu{position:fixed;inset:0;z-index:200;pointer-events:none}
#tourFundo{position:absolute;inset:0;background:rgba(5,8,14,.78);pointer-events:auto}
#tourFoco{position:absolute;border:2px solid var(--gold);border-radius:12px;
  box-shadow:0 0 0 9999px rgba(5,8,14,.78);transition:all .35s ease;pointer-events:none}
#tourBalao{position:absolute;background:var(--card);border:1px solid var(--gold);border-radius:12px;
  padding:16px;max-width:320px;pointer-events:auto;transition:all .35s ease}
#tourBalao .util{color:var(--gold)}
#tourBalao p{margin:8px 0 14px;font-size:15.5px}
#tourBalao .nav{display:flex;gap:8px;justify-content:space-between}
#tourBalao button{font-size:14px;padding:8px 14px}
</style></head>
<body>
<div class="topo">
  <h1 id="tituloPainel">Painel</h1>
  <span class="util" id="modoDemoTag"></span>
  <button id="btnTour" title="Rever o tour" onclick="Tour.iniciar(true)">?</button>
</div>
<nav class="abas" id="abas">
  <button data-aba="hoje" class="sel">Hoje</button>
  <button data-aba="leads">Leads</button>
  <button data-aba="casos">Clientes & Casos</button>
  <button data-aba="docs">Documentos</button>
</nav>
<main id="conteudo"><p class="vazio">Carregando…</p></main>
<div class="lgpd">🔒 <span id="lgpdTxt"></span></div>
<div id="zonaModal"></div>
<?!= include('Tour'); ?>

<script>
let DB = null, abaAtiva = 'hoje';
const F = { faixa:'', fase:'', beneficio:'', ordem:'score' };
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cls = f => ({'Prioritário':'b-prior','Qualificado':'b-qual','Em avaliação':'b-aval'}[f]||'b-info');
const fmtD = v => { if(!v) return ''; const d=new Date(v); return isNaN(d)?esc(v):d.toLocaleDateString('pt-BR'); };
const fmtDH = v => { if(!v) return ''; const d=new Date(v); return isNaN(d)?esc(v):d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };

google.script.run.withSuccessHandler(d => { DB=d; boot(); }).getPainelData();

function boot(){
  $('tituloPainel').textContent = 'Painel · '+DB.config.advogada;
  $('lgpdTxt').textContent = DB.config.rodapeLgpd;
  if (DB.config.modoDemo) $('modoDemoTag').textContent = 'DEMO';
  document.querySelectorAll('#abas button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#abas button').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); abaAtiva=b.dataset.aba; pinta();
  });
  pinta();
  if (DB.config.modoDemo && !localStorage.getItem('tourVisto')) Tour.iniciar(false);
}
function recarregar(){ google.script.run.withSuccessHandler(d=>{DB=d;pinta();}).getPainelData(); }

/* ---------------- render ---------------- */
function pinta(){
  const c = $('conteudo');
  if (abaAtiva==='hoje')  c.innerHTML = vHoje();
  if (abaAtiva==='leads') c.innerHTML = vLeads();
  if (abaAtiva==='casos') c.innerHTML = vCasos();
  if (abaAtiva==='docs')  c.innerHTML = vDocs();
}

function vHoje(){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const em7 = new Date(hoje); em7.setDate(em7.getDate()+7);
  const acoes = DB.casos.filter(cs => cs.data_proxima_acao && new Date(cs.data_proxima_acao) <= em7 && cs.fase!=='Encerrado')
    .sort((a,b)=>new Date(a.data_proxima_acao)-new Date(b.data_proxima_acao));
  const novos = DB.leads.filter(l=>l.status_lead==='Novo')
    .sort((a,b)=>b.score-a.score);
  const agHoje = DB.agenda.filter(a=>a.data_confirmada && new Date(a.data_confirmada).toDateString()===new Date().toDateString());
  let h = '<section id="secAgendaHoje"><h2 style="font-size:19px;margin-bottom:10px">Agenda de hoje</h2>';
  h += agHoje.length ? agHoje.map(a=>`<div class="card item"><div class="linha1">
      <span class="nome">${esc(nomeDe(a))}</span><span class="util">${fmtDH(a.data_confirmada)}</span></div>
      <div class="meta">${esc(a.tipo)} · ${esc(a.modalidade||'')}</div></div>`).join('')
    : '<p class="vazio">Nada agendado para hoje.</p>';
  h += '</section><section id="secAcoes" style="margin-top:22px"><h2 style="font-size:19px;margin-bottom:10px">Próximas ações (7 dias)</h2>';
  h += acoes.length ? acoes.map(cs => {
      const cli = DB.clientes.find(x=>x.id_cliente===cs.id_cliente)||{};
      const atrasada = new Date(cs.data_proxima_acao) < hoje;
      return `<div class="card item ${atrasada?'alertaHoje':''}">
        <div class="linha1"><span class="nome">${esc(cli.nome_completo)}</span>
        <span class="util" style="color:${atrasada?'var(--erro)':'var(--texto-2)'}">${fmtD(cs.data_proxima_acao)}</span></div>
        <div class="meta">${esc(cs.proxima_acao)} — <em>${esc(cs.fase)}</em></div>
        <div class="acoes"><button class="btn-fantasma" onclick="abrirCaso('${cs.id_caso}')">Abrir caso</button></div></div>`;
    }).join('') : '<p class="vazio">Nenhuma ação pendente. 🎉</p>';
  h += '</section><section id="secNovos" style="margin-top:22px"><h2 style="font-size:19px;margin-bottom:10px">Leads aguardando resposta</h2>';
  h += novos.length ? novos.map(cardLead).join('') : '<p class="vazio">Caixa de entrada limpa.</p>';
  return h+'</section>';
}

function vLeads(){
  let lista = DB.leads.slice();
  if (F.faixa) lista = lista.filter(l=>l.faixa===F.faixa);
  const ord = {
    score:(a,b)=>b.score-a.score,
    data:(a,b)=>new Date(b.data_entrada)-new Date(a.data_entrada),
    alfa:(a,b)=>String(a.nome).localeCompare(b.nome,'pt-BR')
  }[F.ordem];
  lista.sort(ord);
  return `<div class="filtros" id="filtrosLeads">
    <select onchange="F.faixa=this.value;pinta()">
      <option value="">Todas as faixas</option>
      ${['Prioritário','Qualificado','Em avaliação','Informativo'].map(f=>`<option ${F.faixa===f?'selected':''}>${f}</option>`).join('')}
    </select>
    <select onchange="F.ordem=this.value;pinta()">
      <option value="score" ${F.ordem==='score'?'selected':''}>Por prioridade</option>
      <option value="data" ${F.ordem==='data'?'selected':''}>Mais recentes</option>
      <option value="alfa" ${F.ordem==='alfa'?'selected':''}>A–Z</option>
    </select></div>` +
    (lista.length ? lista.map(cardLead).join('') : '<p class="vazio">Nenhum lead nessa combinação de filtros.</p>');
}

function cardLead(l){
  const janelas = [l.janela_1,l.janela_2,l.janela_3].filter(Boolean);
  const aguardando = !l.janela_escolhida && janelas.length && /Novo|Contatado/.test(l.status_lead);
  return `<div class="card item" data-lead="${l.id_lead}">
    <div class="linha1"><span class="nome">${esc(l.nome)}</span>
      <span class="badge ${cls(l.faixa)}">${esc(l.faixa)}</span>
      <span class="score">${l.score}</span></div>
    <div class="meta">${esc(l.beneficio_pretendido)} · ${esc(l.cidade||'')} · ${esc(l.status_lead)}
      ${l.quem_indicou?` · indicação de ${esc(l.quem_indicou)}`:''}</div>
    ${l.relato?`<div class="relato">“${esc(String(l.relato).slice(0,220))}${String(l.relato).length>220?'…':''}”</div>`:''}
    ${aguardando?`<div class="meta" style="margin-top:10px">Horários sugeridos:</div>
      <div class="acoes">${janelas.map(j=>`<button class="btn" style="font-size:14px" onclick="escolher('${l.id_lead}','${esc(j)}')">${esc(j)}</button>`).join('')}</div>`:''}
    <div class="acoes">
      ${l.status_lead==='Consulta realizada'||l.status_lead==='Agendado'
        ?`<button class="btn" onclick="Consulta.abrir('${l.id_lead}')">Modo consulta</button>`:''}
      <button class="btn-fantasma" onclick="Msg.abrir({id_lead:'${l.id_lead}'})">Mensagem</button>
    </div></div>`;
}

function vCasos(){
  let lista = DB.casos.slice();
  if (F.fase) lista = lista.filter(c=>c.fase===F.fase);
  return `<div class="filtros"><select onchange="F.fase=this.value;pinta()">
      <option value="">Todas as fases</option>
      ${DB.config.fases.map(f=>`<option ${F.fase===f?'selected':''}>${f}</option>`).join('')}</select></div>` +
    (lista.length ? lista.map(cs => {
      const cli = DB.clientes.find(x=>x.id_cliente===cs.id_cliente)||{};
      const pend = DB.docs.filter(d=>d.id_caso===cs.id_caso && /Pendente|Solicitado/.test(d.status)).length;
      return `<div class="card item" data-caso="${cs.id_caso}">
        <div class="linha1"><span class="nome">${esc(cli.nome_completo)}</span>
          <span class="badge b-qual">${esc(cs.fase)}</span></div>
        <div class="meta">${esc(cs.tipo_beneficio)} · via ${esc(cs.via)}
          ${cs.numero_requerimento_nb?` · NB ${esc(cs.numero_requerimento_nb)}`:''}
          ${pend?` · <b style="color:var(--alerta)">${pend} doc(s) pendente(s)</b>`:''}</div>
        <div class="acoes">
          <button class="btn-fantasma" onclick="abrirCaso('${cs.id_caso}')">Detalhes</button>
          <button class="btn-fantasma" onclick="Msg.abrir({id_cliente:'${cs.id_cliente}',id_caso:'${cs.id_caso}'})">Responder status</button>
          <button class="btn-fantasma" onclick="pdf('${cs.id_caso}',this)">Relatório PDF</button>
          <button class="btn-fantasma" onclick="astrea('${cs.id_cliente}')">Exportar p/ Astrea</button>
        </div></div>`;
    }).join('') : '<p class="vazio">Nenhum caso nessa fase.</p>');
}

function vDocs(){
  const pend = DB.docs.filter(d=>/Pendente|Solicitado/.test(d.status));
  return '<h2 style="font-size:19px;margin-bottom:10px">Documentos em aberto</h2>' +
    (pend.length ? pend.map(d => {
      const cs = DB.casos.find(x=>x.id_caso===d.id_caso)||{};
      const cli = DB.clientes.find(x=>x.id_cliente===cs.id_cliente)||{};
      return `<div class="card item"><div class="linha1">
        <span class="nome" style="font-size:16px">${esc(d.nome_documento)}</span>
        <span class="badge ${d.status==='Pendente'?'b-prior':'b-aval'}">${esc(d.status)}</span></div>
      <div class="meta">${esc(cli.nome_completo)} · ${esc(cs.tipo_beneficio||'')}</div>
      <div class="acoes">
        <button class="btn-fantasma" onclick="docStatus('${d.id_doc}','Recebido')">Marcar recebido</button>
        <button class="btn-fantasma" onclick="docStatus('${d.id_doc}','Validado')">Validar</button>
      </div></div>`;
    }).join('') : '<p class="vazio">Nenhum documento pendente. ✓</p>');
}

/* ---------------- ações ---------------- */
function nomeDe(a){
  if (a.id_cliente){ const c=DB.clientes.find(x=>x.id_cliente===a.id_cliente); if(c) return c.nome_completo; }
  if (a.id_lead){ const l=DB.leads.find(x=>x.id_lead===a.id_lead); if(l) return l.nome; }
  return '';
}
function escolher(idLead, janela){
  google.script.run.withSuccessHandler(()=>{ recarregar();
    Msg.abrir({id_lead:idLead, gatilho:'Consulta confirmada', data:janela.split(' ')[0], hora:janela.split(' ')[1]||''});
  }).escolherJanela(idLead, janela);
}
function docStatus(id, st){ google.script.run.withSuccessHandler(recarregar).mudarStatusDoc(id, st); }
function pdf(idCaso, btn){
  btn.textContent='Gerando…'; btn.disabled=true;
  google.script.run.withSuccessHandler(r=>{ btn.textContent='Relatório PDF'; btn.disabled=false;
    if(r.ok) window.open(r.url,'_blank'); }).gerarRelatorioPdf(idCaso);
}
function astrea(idCliente){
  google.script.run.withSuccessHandler(r=>{
    modal(`<h3>Exportar para o Astrea</h3>
      <p class="meta" style="margin-bottom:10px">Copie e cole no cadastro do cliente — ou baixe o CSV para importação em lote.</p>
      <textarea readonly>${esc(r.bloco)}</textarea>
      <div class="acoes" style="margin-top:12px">
        <button class="btn" onclick="navigator.clipboard.writeText(this.closest('.modal').querySelector('textarea').value);this.textContent='Copiado ✓'">Copiar</button>
        <a class="btn-fantasma btn" download="astrea_${r.nome.replace(/\\s+/g,'_')}.csv"
           href="data:text/csv;charset=utf-8,${encodeURIComponent(r.csv)}">Baixar CSV</a>
        <button class="btn-fantasma" onclick="fecharModal()">Fechar</button></div>`);
  }).exportarAstrea(idCliente);
}
function abrirCaso(idCaso){
  const cs = DB.casos.find(x=>x.id_caso===idCaso); const cli=DB.clientes.find(x=>x.id_cliente===cs.id_cliente)||{};
  const docs = DB.docs.filter(d=>d.id_caso===idCaso);
  modal(`<h3>${esc(cli.nome_completo)}</h3>
    <p class="meta">${esc(cs.tipo_beneficio)} · via ${esc(cs.via)}</p>
    <div style="margin:14px 0"><label class="util">FASE</label>
      <select onchange="google.script.run.withSuccessHandler(recarregar).mudarFase('${idCaso}',this.value)">
        ${DB.config.fases.map(f=>`<option ${cs.fase===f?'selected':''}>${f}</option>`).join('')}</select></div>
    ${cs.proxima_acao?`<p><b>Próxima ação:</b> ${esc(cs.proxima_acao)} (${fmtD(cs.data_proxima_acao)})</p>`:''}
    ${cli.link_pasta_drive?`<p style="margin-top:8px"><a href="${esc(cli.link_pasta_drive)}" target="_blank" style="color:var(--gold)">📁 Pasta no Drive</a>
      <span class="meta"> — cole este link no Astrea como Ligação Externa</span></p>`:''}
    <div style="margin-top:14px"><label class="util">DOCUMENTOS</label>
      ${docs.map(d=>`<div class="chk"><label>${esc(d.nome_documento)}
        <span class="dica">${esc(d.status)}</span></label></div>`).join('')||'<p class="meta">Nenhum.</p>'}</div>
    <div class="acoes" style="margin-top:14px"><button class="btn-fantasma" onclick="fecharModal()">Fechar</button></div>`);
}

/* ---------------- mensagens (rascunho sempre) ---------------- */
const Msg = {
  abrir(alvo){
    const tpls = DB.templates.filter(t=>String(t.ativo)==='Sim');
    const pre = alvo.gatilho ? tpls.find(t=>t.gatilho===alvo.gatilho) : null;
    modal(`<h3>Nova mensagem</h3>
      <p class="meta" style="margin-bottom:10px">O sistema escreve o rascunho. <b>Você revisa e envia.</b> Nada sai sozinho.</p>
      <select id="msgTpl">${tpls.map(t=>`<option value="${t.id_template}" ${pre&&pre.id_template===t.id_template?'selected':''}>${esc(t.gatilho)}</option>`).join('')}</select>
      <textarea id="msgCorpo" style="margin-top:10px" placeholder="Escolha um modelo acima…"></textarea>
      <div class="acoes" style="margin-top:12px">
        <a id="msgWa" class="btn" target="_blank" style="display:none">Abrir no WhatsApp</a>
        <button id="msgMail" class="btn-fantasma" style="display:none">Rascunho no Gmail</button>
        <button class="btn-fantasma" onclick="fecharModal()">Cancelar</button></div>`);
    const gerar = () => google.script.run.withSuccessHandler(r=>{
        $('msgCorpo').value = r.corpo;
        const wa=$('msgWa'), ml=$('msgMail');
        wa.style.display = r.waLink?'inline-block':'none';
        ml.style.display = r.email?'inline-block':'none';
        wa.onclick = () => { wa.href='https://wa.me/'+r.telefone.replace(/\D/g,'')+'?text='+encodeURIComponent($('msgCorpo').value); };
        wa.href = r.waLink;
        ml.onclick = () => google.script.run.withSuccessHandler(()=>{ml.textContent='Rascunho criado ✓'})
          .criarRascunhoEmail(r.email, r.assunto||'Sobre o seu caso', $('msgCorpo').value);
      }).gerarMensagem($('msgTpl').value, alvo);
    $('msgTpl').onchange = gerar; gerar();
  }
};

/* ---------------- modo consulta ---------------- */
const Consulta = {
  abrir(idLead){
    const l = DB.leads.find(x=>x.id_lead===idLead);
    const itens = ['Confirmei a história contributiva e as datas principais',
      'Identifiquei o benefício adequado (ou redirecionei)',
      'Verifiquei requerimentos anteriores e negativas',
      'Expliquei as etapas, prazos realistas e riscos',
      'Apresentei os honorários e a forma de contratação',
      'Cliente decidiu contratar'];
    modal(`<h3>Consulta · ${esc(l.nome)}</h3>
      <p class="meta">${esc(l.beneficio_pretendido)} · score ${l.score} (${esc(l.faixa)})</p>
      ${l.relato?`<div class="relato">“${esc(l.relato)}”</div>`:''}
      <div style="margin-top:12px">${itens.map((t,i)=>`<div class="chk">
        <input type="checkbox" id="ck${i}"><label for="ck${i}">${t}</label></div>`).join('')}</div>
      <textarea id="ckObs" style="margin-top:12px" placeholder="Anotações da consulta (ficam no lead)"></textarea>
      <div class="acoes" style="margin-top:14px">
        <button class="btn" onclick="Consulta.fechar('${idLead}',true)">Contratou → gerar caso + checklist</button>
        <button class="btn-fantasma" onclick="Consulta.fechar('${idLead}',false)">Não contratou</button>
        <button class="btn-fantasma" onclick="fecharModal()">Voltar</button></div>`);
  },
  fechar(idLead, contratou){
    const obs = $('ckObs').value;
    if (obs) google.script.run.salvarObservacaoLead(idLead, obs);
    if (!contratou){
      google.script.run.withSuccessHandler(()=>{fecharModal();recarregar();}).mudarStatusLead(idLead,'Não convertido');
      return;
    }
    google.script.run.withSuccessHandler(r=>{
      fecharModal(); recarregar();
      if (r.ok) Msg.abrir({id_cliente:r.id_cliente, id_caso:r.id_caso, gatilho:'Envio do checklist de documentos'});
    }).converterLead(idLead, {});
  }
};

/* ---------------- modal util ---------------- */
function modal(html){ $('zonaModal').innerHTML = `<div class="veu" onclick="if(event.target===this)fecharModal()"><div class="modal">${html}</div></div>`; }
function fecharModal(){ $('zonaModal').innerHTML=''; }
</script>
</body></html>
