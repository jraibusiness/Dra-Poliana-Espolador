<!-- ============================================================
  Estilo.html · Identidade Visual + base compartilhada
  Regras da casa (Opus AI): mobile-first sempre; mínimo de cliques
  e de digitação; nenhum controle com aparência padrão do sistema.
============================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg-app:#F8FAFC; --bg-header:#FFFFFF; --bg-card:#FFFFFF;
  --text-main:#1E293B; --text-muted:#64748B;
  --primary:#52091c; --primary-hover:#7a102b;
  --primary-08:rgba(82,9,28,.08); --primary-16:rgba(82,9,28,.16);
  --borda:#E2E8F0; --borda-forte:#CBD5E1;
  /* ---------------------------------------------------------------
     DUAS escalas, e nunca a mesma cor nas duas.

     1) PRIORIDADE do contato — quatro degraus ordenados. É o próprio
        vinho da marca clareando: quanto mais escuro, mais urgente.
        Rampa ordinal de um só tom (claro 2,41:1 sobre o fundo).

     2) ESTADO do caso — semáforo. Verde-azulado / âmbar / carmim.
        Verde puro foi descartado: verde e vermelho medem ΔE 6,0 sob
        deuteranopia, ou seja, para quem tem daltonismo vermelho-verde
        "resolvido" e "urgente" ficam praticamente iguais. O verde-azulado
        sobe esse par para ΔE 12,5 e passa em todos os testes.

     As duas escalas não compartilham nenhum tom, então uma etiqueta de
     prioridade nunca é confundida com um aviso de prazo.
     Toda cor de estado anda acompanhada de ícone e texto — cor sozinha
     não carrega significado em lugar nenhum desta plataforma.
     --------------------------------------------------------------- */

  /* 1) Prioridade (rampa ordinal do vinho) */
  --p4:#CE93A4; --p4-bg:#FBF5F7; --p4-bd:#F0DCE2;   /* Informativo   */
  --p3:#B45C78; --p3-bg:#FBF1F4; --p3-bd:#EBCCD6;   /* Em avaliação  */
  --p2:#8C1338; --p2-bg:#FDF2F5; --p2-bd:#E8C4D0;   /* Qualificado   */
  --p1:#52091c; --p1-bg:#FCF1F4; --p1-bd:#E3BAC7;   /* Prioritário   */

  /* 2) Estado (semáforo) */
  --st-ok:#0D9488;      --st-ok-bg:#F0FDFA;      --st-ok-bd:#99F6E4;
  --st-atencao:#D97706; --st-atencao-bg:#FFFBEB; --st-atencao-bd:#FDE68A;
  --st-urgente:#9F1239; --st-urgente-bg:#FFF1F2; --st-urgente-bd:#FECDD3;
  --st-neutro:#475569;  --st-neutro-bg:#F1F5F9;  --st-neutro-bd:#E2E8F0;

  --ok:var(--st-ok); --alerta:var(--st-atencao); --erro:var(--st-urgente); --info:var(--st-neutro);
  --font-display:'Lexend',sans-serif; --font-corpo:'Inter',sans-serif; --font-util:'Space Mono',monospace;
  --raio:10px; --raio-lg:16px;
  --sombra:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --sombra-lg:0 10px 15px -3px rgba(16,24,40,.08), 0 4px 6px -4px rgba(16,24,40,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg-app);color:var(--text-main);font-family:var(--font-corpo);
  font-size:16px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,h6{font-family:var(--font-display);font-weight:600;line-height:1.25}
small,.util{font-family:var(--font-util);font-size:12px;letter-spacing:.02em}

/* ---------------------------------------------------------------
   Quebra de linha. Era daqui que vinha o ar amador: títulos em três
   linhas com duas palavras sozinhas na última, e parágrafos terminando
   numa palavra órfã.

   balance  -> distribui o título em linhas de largura parecida
   pretty   -> impede que a última linha do parágrafo fique com uma palavra

   Navegador que não conhece as duas propriedades simplesmente ignora:
   volta ao comportamento de hoje, nada quebra.
   --------------------------------------------------------------- */
h1,h2,h3,h4,h5,h6,.pergunta,.hero h2{text-wrap:balance}
p,li,.sub,.dica,.meta,.relato{text-wrap:pretty}

/* Palavras longas do vocabulário previdenciário (o campeão é
   "Aposentadoria por tempo de contribuição") não podem estourar a
   caixa nem forçar barra horizontal no celular. */
body{overflow-wrap:break-word}

/* Controles de formulario - nunca herdam a aparencia do sistema operacional.
   (A ausencia desta regra era a causa dos campos "cinza chumbo".) */
input,select,textarea{
  font-family:var(--font-corpo); font-size:16px; /* 16px evita zoom automatico no iOS */
  padding:12px 14px; width:100%;
  border:1.5px solid var(--borda); border-radius:var(--raio);
  background:#FFFFFF; color:var(--text-main); outline:none;
  transition:border-color .15s, box-shadow .15s;
  -webkit-appearance:none; appearance:none;
}
select{
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat; background-position:right 14px center; padding-right:40px;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-08)}
button{font-family:var(--font-corpo);cursor:pointer;border:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
::selection{background:var(--primary);color:#fff}

/* Botoes - alvo de toque minimo de 46px (acessibilidade movel) */

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:12px 22px;background:var(--primary);color:#fff;
  font-weight:600;font-size:15px;text-align:center;text-decoration:none;
  border-radius:var(--raio);border:none;cursor:pointer;transition:background .15s,transform .1s}

.btn:hover{background:var(--primary-hover)}

.btn:active{transform:scale(.985)}

.btn:disabled{opacity:.5;cursor:not-allowed}

.btn-fantasma{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:12px 22px;background:#FFFFFF;color:var(--text-main);
  border:1.5px solid var(--borda);border-radius:var(--raio);
  font-weight:500;font-size:15px;cursor:pointer;text-decoration:none;transition:all .15s}

.btn-fantasma:hover{background:var(--bg-app);border-color:var(--borda-forte)}

/* Cartao base - usado pelo Painel */

.card{background:var(--bg-card);border:1px solid var(--borda);border-radius:var(--raio-lg);
  padding:18px;box-shadow:var(--sombra)}

/* ---------------------------------------------------------------
   Faixa lateral de estado. Um fio colorido na borda esquerda do cartão
   diz, antes de qualquer leitura, em que pé está aquele caso.
   Acompanha sempre um selo com ícone e texto — a cor reforça, não informa.
   --------------------------------------------------------------- */
.card[data-estado]{border-left-width:4px;border-left-style:solid}
.card[data-estado="ok"]     {border-left-color:var(--st-ok)}
.card[data-estado="atencao"]{border-left-color:var(--st-atencao)}
.card[data-estado="urgente"]{border-left-color:var(--st-urgente)}
.card[data-estado="neutro"] {border-left-color:var(--st-neutro)}

/* Selo de estado: ícone + palavra. Nunca só a cor. */
.selo{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  font-size:12px;font-weight:600;letter-spacing:.01em;border:1px solid transparent;
  white-space:nowrap;line-height:1.35}
.selo .ic{font-size:11px;line-height:1;flex:none}
.s-ok     {background:var(--st-ok-bg);     color:var(--st-ok);     border-color:var(--st-ok-bd)}
.s-atencao{background:var(--st-atencao-bg);color:var(--st-atencao);border-color:var(--st-atencao-bd)}
.s-urgente{background:var(--st-urgente-bg);color:var(--st-urgente);border-color:var(--st-urgente-bd)}
.s-neutro {background:var(--st-neutro-bg); color:var(--st-neutro); border-color:var(--st-neutro-bd)}

/* Selos de classificacao */

.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  font-family:var(--font-corpo);font-size:12px;font-weight:600;letter-spacing:.01em;
  border:1px solid transparent;white-space:nowrap}

/* O texto do selo usa tinta de texto; a cor da faixa vive no ponto.
   Escrever "Informativo" no rosa claro da ponta da rampa daria 2,4:1 —
   legível como marca gráfica, ruim como palavra. */
.badge{color:var(--text-main)}
.badge::before{content:'';width:7px;height:7px;border-radius:50%;flex:none;
  background:var(--ponto, var(--text-muted))}

.b-prior{background:var(--p1-bg);border-color:var(--p1-bd);--ponto:var(--p1)}
.b-qual {background:var(--p2-bg);border-color:var(--p2-bd);--ponto:var(--p2)}
.b-aval {background:var(--p3-bg);border-color:var(--p3-bd);--ponto:var(--p3)}
.b-info {background:var(--p4-bg);border-color:var(--p4-bd);--ponto:var(--p4)}

/* Indicadores de carregamento */

.loading{position:relative;color:transparent!important;pointer-events:none}

.loading::after{content:'';position:absolute;top:50%;left:50%;width:18px;height:18px;
  margin:-9px 0 0 -9px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite}

.btn-fantasma.loading::after{border-color:rgba(0,0,0,.12);border-top-color:var(--text-main)}

@keyframes spin{100%{transform:rotate(360deg)}}

.spinner{width:22px;height:22px;border:2.5px solid var(--borda);border-top-color:var(--primary);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}

.carregando-bloco{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:56px 20px;color:var(--text-muted);text-align:center}

/* Veu de processamento em tela cheia - com desfoque do fundo */

#veuCarregando{position:fixed;inset:0;z-index:2000;background:rgba(248,250,252,.72);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:none;place-items:center;text-align:center;padding:24px}

#veuCarregando.on{display:grid}

#veuCarregando .spinner{width:38px;height:38px;border-width:3px}

#veuCarregando p{margin-top:16px;color:var(--text-muted);font-size:15px}

/* Dialogos do sistema - substituem alert()/confirm() nativos,
   que quebram a identidade visual e ficam ruins no celular. */

#zonaDialogo{position:fixed;inset:0;z-index:3000;display:none;place-items:center;
  padding:20px;background:rgba(15,23,42,.55)}

#zonaDialogo.on{display:grid}

.dlg{background:#fff;border-radius:var(--raio-lg);box-shadow:var(--sombra-lg);
  width:100%;max-width:400px;padding:26px 24px;text-align:center;
  animation:dlgSurge .22s cubic-bezier(.16,1,.3,1)}

@keyframes dlgSurge{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}

.dlg-icone{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  margin:0 auto 16px;font-size:24px;font-weight:700;background:var(--primary-08);color:var(--primary)}

.dlg-icone.aviso{background:var(--p2-bg);color:var(--p2)}

.dlg-icone.erro{background:var(--p1-bg);color:var(--p1)}

.dlg-icone.ok{background:#ECFDF5;color:var(--ok)}

.dlg h4{font-size:19px;margin-bottom:8px;color:var(--text-main)}

.dlg p{color:var(--text-muted);font-size:15px;margin-bottom:22px}

.dlg .dlg-acoes{display:flex;gap:10px;flex-direction:column}

.dlg .dlg-acoes .btn,.dlg .dlg-acoes .btn-fantasma{width:100%}

/* Rodape LGPD */

.lgpd{text-align:center;color:var(--text-muted);font-size:12.5px;line-height:1.65;
  padding-top:20px;border-top:1px solid var(--borda)}

.lgpd strong{color:var(--text-main);font-weight:600}

.lgpd .lgpd-artigos{display:block;margin-top:6px;font-size:11.5px;opacity:.85}

/* ===============================================================
   QUADROS DE RESUMO (o "como estou hoje", em quatro números)
   Números grandes, proporcionais — tabular-nums só faz sentido
   em coluna, e aqui eles ficam lado a lado.
   =============================================================== */
.resumo-grade{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}
@media(min-width:660px){ .resumo-grade{grid-template-columns:repeat(4,1fr)} }

.quadro{background:var(--bg-card);border:1px solid var(--borda);border-radius:var(--raio-lg);
  padding:15px 16px;box-shadow:var(--sombra);display:flex;flex-direction:column;gap:3px;
  text-align:left;min-height:104px;cursor:pointer;transition:border-color .15s, transform .1s}
.quadro:hover{border-color:var(--borda-forte)}
.quadro:active{transform:scale(.99)}
.quadro[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-08)}
.quadro .n{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1.1;
  letter-spacing:-.02em;color:var(--text-main)}
.quadro .rot{font-size:12.5px;color:var(--text-muted);line-height:1.4}
.quadro .marca{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  letter-spacing:.02em;margin-top:2px}
.quadro[data-estado="ok"]      .n, .quadro[data-estado="ok"]      .marca{color:var(--st-ok)}
.quadro[data-estado="atencao"] .n, .quadro[data-estado="atencao"] .marca{color:var(--st-atencao)}
.quadro[data-estado="urgente"] .n, .quadro[data-estado="urgente"] .marca{color:var(--st-urgente)}
.quadro[data-estado="neutro"]  .marca{color:var(--st-neutro)}
/* Zero não pode continuar vermelho. "Nenhum prazo vencido" é a melhor
   notícia da tela; pintá-la da cor do alarme ensina a ignorar o alarme. */
.quadro[data-zero] .n{color:var(--text-muted)}
.quadro[data-zero="sim"] .marca{color:var(--st-ok)}
.quadro[data-zero="neutro"] .marca{color:var(--text-muted)}

/* ===============================================================
   GRÁFICO DE CASOS POR FASE
   Barras horizontais, uma por fase, rotuladas diretamente. A cor
   diz o estado que a fase significa (em dia / atenção / prazo
   correndo), e não o tamanho da barra — o tamanho a barra já mostra.
   HTML e CSS puros: nenhuma biblioteca, nenhum custo, nada carregado
   de fora.
   =============================================================== */
.gr{display:flex;flex-direction:column;gap:2px;margin-top:4px}
/* rótulo | medida | contagem — tudo numa linha só, para o olho
   percorrer a coluna de números sem saltar de altura. */
/* A coluna da medida é declarada aqui, e não na largura do filho: com
   'auto', o grid a media pelo conteúdo mínimo do flex de dentro (um
   quadradinho) e os 150px transbordavam para fora do cartão. */
.gr-linha{display:grid;grid-template-columns:minmax(0,1fr) 150px 2.2em;gap:6px 12px;
  align-items:center;padding:7px 0;border-bottom:1px solid #F1F5F9}
@media(max-width:520px){ .gr-linha{grid-template-columns:minmax(0,1fr) 92px 2.2em;gap:6px 10px} }
.gr-linha:last-child{border-bottom:none}
.gr-rot{font-size:13.5px;color:var(--text-main);line-height:1.4}
.gr-val{font-size:13.5px;font-weight:600;color:var(--text-main);
  font-variant-numeric:tabular-nums;text-align:right}
.gr-trilho{width:100%;height:8px;background:#EEF2F6;border-radius:99px;overflow:hidden}
.gr-barra{height:100%;border-radius:99px;min-width:4px;   /* 4px: uma barra de 1 caso continua visível */
  transition:width .45s cubic-bezier(.16,1,.3,1)}
.gr-barra[data-estado="ok"]     {background:var(--st-ok)}
.gr-barra[data-estado="atencao"]{background:var(--st-atencao)}
.gr-barra[data-estado="urgente"]{background:var(--st-urgente)}
.gr-barra[data-estado="neutro"] {background:var(--st-neutro)}

/* Um quadrado por caso, enquanto o volume permite contar de olho.
   O vão de 3px entre eles é o que deixa a contagem possível. */
.gr-unidades{display:flex;flex-wrap:wrap;gap:3px;min-width:0}
.gr-unidades i{width:13px;height:13px;border-radius:4px;flex:none;font-style:normal}
.gr-unidades i[data-estado="ok"]     {background:var(--st-ok)}
.gr-unidades i[data-estado="atencao"]{background:var(--st-atencao)}
.gr-unidades i[data-estado="urgente"]{background:var(--st-urgente)}
.gr-unidades i[data-estado="neutro"] {background:var(--st-neutro)}

/* Legenda do semáforo — obrigatória: sem ela a cor seria adivinhação. */
.gr-legenda{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--borda)}
.gr-legenda span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}
.gr-legenda i{width:9px;height:9px;border-radius:3px;flex:none;font-style:normal}

.oculto{display:none!important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
<div id="veuCarregando"><div><div class="spinner"></div><p id="veuCarregandoTxt">Processando...</p></div></div>
<div id="zonaDialogo"></div>

<script>

/* ---- Utilidades compartilhadas (LP e Painel) ---- */

function _q(id){ return document.getElementById(id); }

/** Veu de processamento em tela cheia. */

function mostrarCarregando(msg){
  var v=_q('veuCarregando'); if(!v) return;
  if(msg) _q('veuCarregandoTxt').textContent = msg;
  v.classList.add('on');
}

function esconderCarregando(){ var v=_q('veuCarregando'); if(v) v.classList.remove('on'); }

/** Dialogo na identidade da plataforma. Substitui alert()/confirm(). */

function dialogo(opts){
  var o = opts || {};
  var z = _q('zonaDialogo'); if(!z) return;
  var tipo = o.tipo || 'aviso';
  var icones = { aviso:'!', erro:'x', ok:'\u2713', info:'i' };
  z.innerHTML =
    '<div class="dlg" role="alertdialog" aria-modal="true">' +
      '<div class="dlg-icone ' + tipo + '">' + (o.icone || icones[tipo] || '!') + '</div>' +
      '<h4>' + (o.titulo || 'Atencao') + '</h4>' +
      (o.texto ? '<p>' + o.texto + '</p>' : '') +
      '<div class="dlg-acoes">' +
        (o.onConfirmar ? '<button class="btn" id="dlgOk">' + (o.rotuloConfirmar || 'Confirmar') + '</button>' : '') +
        '<button class="' + (o.onConfirmar ? 'btn-fantasma' : 'btn') + '" id="dlgFechar">' +
          (o.rotuloFechar || (o.onConfirmar ? 'Cancelar' : 'Entendi')) + '</button>' +
      '</div>' +
    '</div>';
  z.classList.add('on');
  _q('dlgFechar').onclick = function(){ fecharDialogo(); if(o.onFechar) o.onFechar(); };
  if(o.onConfirmar) _q('dlgOk').onclick = function(){ fecharDialogo(); o.onConfirmar(); };
  var alvo = _q('dlgOk') || _q('dlgFechar'); if(alvo) alvo.focus();
}

function fecharDialogo(){ var z=_q('zonaDialogo'); if(z){ z.classList.remove('on'); z.innerHTML=''; } }
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') fecharDialogo(); });
</script>
